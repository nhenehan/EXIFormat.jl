# Third-party sources used by EXIFormat's judges and fixtures, fetched by
# scripts/fetch-third-party.sh into ${EXIFORMAT_THIRD_PARTY:-${XDG_CACHE_HOME:-~/.cache}/exiformat/third_party}
# (never into the working tree). Each line: <name> <git url, or a path relative to
# this repository> <40-char commit, or a tag>.
# Pins change through `scripts/fetch-third-party.sh --update <name>` (a commit)
# or by writing a release tag by hand.
#
# exip: C reference implementation; the exipd judge and the EXIficient oracle
#   (utils/xsd2exip).
# rexi: the Rust implementation EXIFormat is ported from. Source of the interop
#   fixtures (EXIficient 1.0.7 bytes; scripts/sync-fixtures.sh) and of the
#   `rexi dump-grammar` listings the schema compiler is compared with.
# exi-testsuite: the W3C EXI test suite, for scripts/w3c-strict.py (the same
#   pin as rexi's).

exip https://github.com/nhenehan/exip.git fd43178f32d480535b08861d07700d106a3f31d7
rexi https://github.com/nhenehan/rexi.git v0.3.1
exi-testsuite https://github.com/w3c/exi-testsuite.git 23d5f587ba3ec281f1a6a8182c1450cb870b469e
